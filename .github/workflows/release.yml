# =============================================================================
# PtIDLE Release Workflow - Build & Push Docker Image to GHCR
# =============================================================================
# 触发: tag push v* + workflow_dispatch (manual)
# 镜像: ghcr.io/yunxihb/ptidle-backend
# 平台: linux/amd64 + linux/arm64 (buildx multi-platform)
#
# Tag 规则:
#   - tag push v1.0.0       → 1.0.0, 1.0, <sha7>, latest
#   - tag push v1.0.0-rc1   → 1.0.0-rc1, 1.0, <sha7>          (pre-release 不打 latest)
#   - workflow_dispatch     → <input version>, <sha7>          (manual 不打 latest)
#
# Auth: secrets.GITHUB_TOKEN (自动, 不需要 user secret)
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag (e.g. v1.0.0-rc1 or dev-abc123)'
        required: true
        default: 'dev'
        type: string

# GHCR push 需要 packages: write 权限
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        # 启用 arm64 emulation (在 amd64 runner 上构建 arm64 镜像)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # tag push: GITHUB_REF = refs/tags/v1.0.0
            RAW_VERSION=${GITHUB_REF#refs/tags/}
          else
            # workflow_dispatch: 用用户输入
            RAW_VERSION=${{ inputs.version }}
          fi
          # 去掉 v 前缀, semver pattern 期望 "1.0.0" 而非 "v1.0.0"
          VERSION=${RAW_VERSION#v}

          # 基础 tags: 完整版本 + sha
          TAGS="ghcr.io/yunxihb/ptidle-backend:${VERSION}"
          TAGS="${TAGS},ghcr.io/yunxihb/ptidle-backend:${SHORT_SHA}"

          # Stable tag push (vX.Y.Z) 才加 major.minor + latest
          # - pre-release (v1.0.0-rc1) 不打 latest, 但仍加 major.minor 方便引用
          # - workflow_dispatch manual 不打 latest
          if [[ "${{ github.event_name }}" == "push" ]] && [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
            TAGS="${TAGS},ghcr.io/yunxihb/ptidle-backend:${MAJOR_MINOR}"
            TAGS="${TAGS},ghcr.io/yunxihb/ptidle-backend:latest"
          fi

          # 输出换行分隔的 tag 列表 (build-push-action 支持多行)
          TAGS_CSV=$(echo "$TAGS" | tr ',' '\n' | tr -d ' ')
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS_CSV" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=ptidle-backend
            org.opencontainers.image.description=PtIDLE game backend (Express + Socket.IO + TypeScript)
            org.opencontainers.image.source=https://github.com/YunXihb/PtIDLE
            org.opencontainers.image.licenses=UNLICENSED
          # GitHub Actions cache 加速后续 build
          cache-from: type=gha
          cache-to: type=gha,mode=max
