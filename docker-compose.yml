# =============================================================================
# PtIDLE Production Docker Compose (单 VPS 部署)
# =============================================================================
# T-FOLLOW-6: 单台 VPS 部署模板 + HTTPS 反向代理
# 5 services: postgres / redis / backend / caddy / migrate (one-shot)
#
# 使用:
#   cd /opt/ptidle
#   docker compose pull              # 拉 backend:latest from GHCR
#   docker compose run --rm migrate  # 跑 migrations
#   docker compose up -d             # 启 backend
#
# 注意:
#   - postgres / redis 用本地 image, backend 用 GHCR
#   - 首次配置: cp .env.example .env, 填 DB_PASSWORD + JWT_SECRET + DOMAIN + ACME_EMAIL
#   - .env 不进 git, 也不进 image
# =============================================================================

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ptidle}
      POSTGRES_USER: ${POSTGRES_USER:-ptidle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ptidle} -d ${POSTGRES_DB:-ptidle}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # one-shot service: 每次 deploy 显式 run, 平时不启 (profiles 隔离)
  # 用 backend 同一 image + MIGRATIONS_DIR env var 指向 baked-in /app/migrations
  migrate:
    image: ghcr.io/yunxihb/ptidle-backend:latest
    profiles: ["migrate"]
    environment:
      MIGRATIONS_DIR: /app/migrations
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-ptidle}
      DB_USER: ${POSTGRES_USER:-ptidle}
      DB_PASSWORD: ${DB_PASSWORD}
      NODE_ENV: production
    command: ["node", "dist/scripts/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  backend:
    # T-FOLLOW-7: env var override 模式
    # 正常 deploy: BACKEND_IMAGE 默认 :latest, docker compose pull 会拉新
    # 回滚时:     BACKEND_IMAGE=$prev_good 传进去, 用指定 digest
    image: ${BACKEND_IMAGE:-ghcr.io/yunxihb/ptidle-backend:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # T-FOLLOW-6: 不再 expose host port, 只通过 Caddy 暴露 (减少攻击面)
    environment:
      MIGRATIONS_DIR: /app/migrations
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-ptidle}
      DB_USER: ${POSTGRES_USER:-ptidle}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # T-FOLLOW-6: HTTPS reverse proxy
  # - 80/443 暴露到 host (Let's Encrypt HTTP-01 需 80 可达)
  # - caddy_data volume 持久化 cert, 容器重建不丢
  # - env DOMAIN 由 .env 注入, {$DOMAIN} 占位符在 Caddyfile 展开
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # Let's Encrypt certs 持久化
      - caddy_config:/config  # Caddy 内部状态
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set}
    depends_on:
      backend:
        condition: service_healthy
    # Caddy 自己没 healthcheck — 启动成功 = 在监听 80/443, 失败会 exit

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config: